name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The build runs the rewrite, which reads API_URL. A placeholder is enough:
      # nothing calls the API at build time (every screen fetches in the browser).
      - run: npm run build
        env:
          API_URL: http://localhost:3001
